name: Build NNECXY FINAL avec Logo N

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install & Build WEB + Logo N
        env:
          VITE_SUPABASE_URL: https://mxlcoetldwduylpieyfg.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_jmtHvlFLu3hKE-8ihABC6w_D8GAunZD
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          npm run build
          
          rm -rf android
          npx cap add android
          
          # Si tu as mis ton logo dans assets/icon.png, on génère
          if [ -f "assets/icon.png" ]; then
            npx capacitor-assets generate --iconBackgroundColor '#000000' --splashBackgroundColor '#000000'
          fi
          
          npx cap copy android
          npx cap sync android
          
          ls -la android/
          
      - name: Build APK 40Mo avec Logo N
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NNECXY-APK-Logo-N-40Mo
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
