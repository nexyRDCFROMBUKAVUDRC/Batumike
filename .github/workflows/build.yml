name: Build NNECXY INSTALLABLE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install & Build
        env:
          VITE_SUPABASE_URL: https://mxlcoetldwduylpieyfg.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_jmtHvlFLu3hKE-8ihABC6w_D8GAunZD
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          npm run build
          rm -rf android
          npx cap add android
          if [ -f "assets/icon.png" ]; then
            npx capacitor-assets generate --iconBackgroundColor '#000000' --splashBackgroundColor '#000000'
          fi
          npx cap copy android
          npx cap sync android
          
      - name: Build APK Debug Signé
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NNECXY-APK-INSTALLABLE-40Mo
          path: android/app/build/outputs/apk/debug/app-debug.apk
